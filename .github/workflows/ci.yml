name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Run Unit Tests with Race Detector
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Build Binaries
        run: |
          go build -v -o bin/pulse-api ./cmd/api
          go build -v -o bin/pulse-worker ./cmd/worker
          go build -v -o bin/pulse-forecast ./cmd/forecast
          go build -v -o bin/loadtest ./cmd/loadtest

  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./build/package/Dockerfile.api
          push: false
          tags: pulse/api:latest

      - name: Build Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./build/package/Dockerfile.worker
          push: false
          tags: pulse/worker:latest

